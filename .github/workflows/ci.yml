name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest
        env:
          TEST_DATABASE_URL: mongodb://localhost:27017
      - name: API schema matches the web app's copy
        run: |
          python -m scripts.export_openapi /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json || {
            echo "::error::apps/web/openapi.json is out of date. Run 'npm run gen:api' in apps/web and commit the result."
            exit 1
          }

  grader-eval:
    name: API · tryout grader against labelled answers
    runs-on: ubuntu-latest
    needs: [api]
    # Calls the real model, so it only runs when the repository has a GEMINI_API_KEY secret.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GEMINI_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt
        if: env.GEMINI_API_KEY != ''
      - run: python -m scripts.eval_grader
        if: env.GEMINI_API_KEY != ''
      - run: echo "No GEMINI_API_KEY secret; skipping the grader evaluation."
        if: env.GEMINI_API_KEY == ''
        # Nothing is checked out in this case, so don't use the job's default directory.
        working-directory: .

  ml:
    name: ML · lint, and retrain Pathfinder from public data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The light subset: Pathfinder needs no deep-learning libraries.
      - run: pip install ruff scikit-learn pandas numpy
      - run: ruff check pathify_ml scripts
      - run: python -m scripts.fetch_data
      - run: python -m scripts.train_pathfinder
      - name: Retrained model still beats the rule-based baseline
        run: |
          python - <<'PY'
          import json
          r = json.load(open("reports/pathfinder.json"))["models"]
          ours, rule = r["mlp_calibrated"]["test"], r["congruence"]["test"]
          print("pathfinder", ours, "congruence", rule)
          assert ours["top3"] >= 0.60, ours
          assert ours["top3"] - rule["top3"] >= 0.10, (ours, rule)
          assert ours["ece"] <= 0.03, ours
          PY

  web:
    name: Web · lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match the schema
        run: |
          npx openapi-typescript openapi.json -o src/lib/api-schema.d.ts
          git diff --exit-code src/lib/api-schema.d.ts || {
            echo "::error::src/lib/api-schema.d.ts is out of date. Run 'npm run gen:api' and commit the result."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end · desktop and phone
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --wait
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456
          SIGNUPS_PER_HOUR_PER_NETWORK: "1000"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test --trace off
        working-directory: apps/web
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
